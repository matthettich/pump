name: build

# Builds every pump plugin for Windows (x64), macOS (universal: Apple Silicon + Intel) and Linux, runs the DSP
# tests, and keeps a rolling "latest" pre-release with the newest builds. A tag like v0.2.0 makes a real release.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# read-only by default (pull-request builds included); only the release job can write
permissions:
  contents: read

# a newer push to the same branch supersedes a running build (only the newest publishes "latest"); several builds at
# once slowed each other past the tests' time limit. Tags always build in full.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5
      - name: Submodules (Eigen from its GitHub mirror, so a GitLab outage can't stop the build)
        shell: bash
        run: |
          git config --global url."https://github.com/eigen-mirror/eigen".insteadOf "https://gitlab.com/libeigen/eigen"
          for attempt in 1 2 3; do git submodule update --init --recursive --jobs 4 && break; echo "::warning::submodule attempt $attempt failed, retrying"; sleep 15; done
          git submodule status --recursive | tee submodules.txt
          if grep -q "^-" submodules.txt; then echo "::error::submodules could not be fetched"; exit 1; fi
      - name: Licence boundary (MACHINE's GPL code stays in MACHINE)
        run: sh tools/check-licence-boundary.sh
      - name: DSP tests
        run: |
          set -o pipefail
          # GitHub keeps only 10 annotations per step: report the failing test and the log tail as one annotation each
          make tests 2>&1 | tee tests.log \
            || { echo "::error::failed in $(grep '^== build' tests.log | tail -1)";
                 echo "::error::$(grep -E 'FAIL|not ok|Assert|Segmentation|terminate|Aborted' tests.log | tail -12 | sed ':a;N;$!ba;s/\n/%0A/g')";
                 echo "::error::$(tail -25 tests.log | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }
      - name: Sanitizers (memory errors and undefined behaviour; data races between the audio, worker and UI threads)
        run: make -j4 tests-asan tests-tsan

  windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5
      - name: Submodules (Eigen from its GitHub mirror, so a GitLab outage can't stop the build)
        shell: bash
        run: |
          git config --global url."https://github.com/eigen-mirror/eigen".insteadOf "https://gitlab.com/libeigen/eigen"
          for attempt in 1 2 3; do git submodule update --init --recursive --jobs 4 && break; echo "::warning::submodule attempt $attempt failed, retrying"; sleep 15; done
          git submodule status --recursive | tee submodules.txt
          if grep -q "^-" submodules.txt; then echo "::error::submodules could not be fetched"; exit 1; fi
      - name: Install MinGW (posix threads)
        timeout-minutes: 25
        run: |
          # the MinGW packages are large (~250 MB): give a slow mirror time, retry, and say so when it never works
          for attempt in 1 2 3; do
            sudo timeout 240 apt-get update -qq -o Acquire::Retries=3 -o Acquire::http::Timeout=60 && \
            sudo timeout 600 apt-get install -y -qq --no-install-recommends -o Acquire::Retries=5 -o Acquire::http::Timeout=60 \
              g++-mingw-w64-x86-64-posix gcc-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64 && break
            echo "::warning::apt attempt $attempt failed, retrying"; sleep 20
          done
          command -v x86_64-w64-mingw32-g++-posix || { echo "::error::MinGW could not be installed (Ubuntu mirror unreachable or too slow)"; exit 1; }
      - name: Build (cross-compile for Windows x64)
        run: |
          set -o pipefail
          make -j4 WINDOWS=true \
            CC=x86_64-w64-mingw32-gcc-posix CXX=x86_64-w64-mingw32-g++-posix \
            AR=x86_64-w64-mingw32-ar WINDRES=x86_64-w64-mingw32-windres PKG_CONFIG=false 2>&1 | tee build.log \
            || { grep -E "error|Error|undefined reference|No rule" build.log | head -12 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - name: Package
        run: |
          mkdir -p dist/pump-windows
          cp -r bin/*.vst3 dist/pump-windows/
          mkdir -p dist/pump-windows/CLAP && cp bin/*.clap dist/pump-windows/CLAP/
          cp docs/INSTALL-windows.txt dist/pump-windows/INSTALL.txt
          cp installer/windows/*.bat dist/pump-windows/
          mkdir -p dist/pump-windows/installer && cp installer/windows/pump-install.ps1 dist/pump-windows/installer/
          cp THIRD_PARTY_NOTICES.md dist/pump-windows/
          cp plugins/machine/NOTICE.md dist/pump-windows/pump-MACHINE-NOTICE.md && cp plugins/machine/fw/LICENSE dist/pump-windows/pump-MACHINE-LICENSE-GPL-3.0.txt
          cd dist && zip -qr pump-windows.zip pump-windows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with: { name: pump-windows, path: dist/pump-windows.zip }

  macos:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5
      - name: Submodules (Eigen from its GitHub mirror, so a GitLab outage can't stop the build)
        shell: bash
        run: |
          git config --global url."https://github.com/eigen-mirror/eigen".insteadOf "https://gitlab.com/libeigen/eigen"
          for attempt in 1 2 3; do git submodule update --init --recursive --jobs 4 && break; echo "::warning::submodule attempt $attempt failed, retrying"; sleep 15; done
          git submodule status --recursive | tee submodules.txt
          if grep -q "^-" submodules.txt; then echo "::error::submodules could not be fetched"; exit 1; fi
      - name: Build (universal)
        run: |
          export CFLAGS="-arch x86_64 -arch arm64 -mmacosx-version-min=10.15"
          export CXXFLAGS="-arch x86_64 -arch arm64 -mmacosx-version-min=10.15"
          export LDFLAGS="-arch x86_64 -arch arm64 -mmacosx-version-min=10.15"
          set -o pipefail
          make -j4 MACOS=true 2>&1 | tee build.log \
            || { grep -E "error|Error|undefined|No rule" build.log | head -12 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - name: Sign (ad-hoc) and package
        run: |
          # our own bundle identifiers (DPF's template uses studio.kx.distrho.*)
          for b in bin/*.vst3 bin/*.clap; do
            [ -e "$b" ] || continue
            n=$(basename "$b"); plutil -replace CFBundleIdentifier -string "com.wake.${n%.*}.${n##*.}" "$b/Contents/Info.plist"
          done
          for b in bin/*.vst3 bin/*.clap bin/*.component; do [ -e "$b" ] && codesign --force --deep -s - "$b" || true; done
          mkdir -p dist/pump-macos/VST3 dist/pump-macos/CLAP dist/pump-macos/Components
          cp -R bin/*.vst3 dist/pump-macos/VST3/
          cp -R bin/*.clap dist/pump-macos/CLAP/
          cp -R bin/*.component dist/pump-macos/Components/ 2>/dev/null || true
          cp docs/INSTALL-macos.txt dist/pump-macos/INSTALL.txt
          cp "installer/macos/Uninstall pump.command" dist/pump-macos/
          mkdir -p dist/pump-macos/installer && cp installer/macos/pump-cleanup.sh dist/pump-macos/installer/
          chmod +x "dist/pump-macos/Uninstall pump.command" dist/pump-macos/installer/pump-cleanup.sh
          cp THIRD_PARTY_NOTICES.md dist/pump-macos/
          cp plugins/machine/NOTICE.md dist/pump-macos/pump-MACHINE-NOTICE.md && cp plugins/machine/fw/LICENSE dist/pump-macos/pump-MACHINE-LICENSE-GPL-3.0.txt
          cd dist && ditto -c -k --keepParent pump-macos pump-macos.zip
      - name: System EQ (menu-bar app)
        # pump EQ on everything the Mac plays; bundles the signed bin/pump-eq.component from the step above
        run: |
          sh system/build.sh "0.1.$GITHUB_RUN_NUMBER"
          mkdir -p dist/system-eq-macos
          cp -R "bin/System EQ.app" dist/system-eq-macos/
          cp docs/INSTALL-system-eq.txt dist/system-eq-macos/INSTALL.txt
          cp THIRD_PARTY_NOTICES.md dist/system-eq-macos/
          cd dist && ditto -c -k --keepParent system-eq-macos system-eq-macos.zip
      - name: Installer (.pkg)
        # Files installed by macOS Installer are not quarantined, so after one "Open Anyway" for the installer
        # itself every plugin loads without Terminal. Bundles are marked non-relocatable so Installer never
        # redirects them to an older copy elsewhere on the disk.
        run: |
          VERSION="0.1.$GITHUB_RUN_NUMBER"
          mkdir -p pkgs
          build_component () {   # $1 = name, $2 = glob, $3 = install location
            rm -rf "root-$1" && mkdir -p "root-$1"
            cp -R $2 "root-$1/" 2>/dev/null || return 0
            pkgbuild --analyze --root "root-$1" "comp-$1.plist"
            n=$(plutil -convert json -o - "comp-$1.plist" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
            # not relocatable (never redirected to an older copy elsewhere); not version-checked and always overwritten:
            # Installer decides what to skip before any script runs, and every build has the same bundle version, so
            # with version checks it skipped every plugin that was installed (which the clean-out then moved away)
            for i in $(seq 0 $((n-1))); do
              plutil -replace "$i.BundleIsRelocatable" -bool NO "comp-$1.plist"
              plutil -replace "$i.BundleIsVersionChecked" -bool NO "comp-$1.plist"
              plutil -replace "$i.BundleOverwriteAction" -string upgrade "comp-$1.plist"
            done
            pkgbuild --root "root-$1" --component-plist "comp-$1.plist" --install-location "$3" \
              --identifier "com.wake.pump.$1" --version "$VERSION" "pkgs/pump-$1.pkg"
          }
          build_component vst3 "bin/*.vst3" "/Library/Audio/Plug-Ins/VST3"
          build_component au "bin/*.component" "/Library/Audio/Plug-Ins/Components"
          build_component clap "bin/*.clap" "/Library/Audio/Plug-Ins/CLAP"
          build_component app "bin/*.app" "/Applications"
          # first: installed pump plugins this version doesn't have (renamed or removed) move to
          # /Library/Audio/Plug-Ins/pump-previous, as do copies in the user's ~/Library; last: the Audio Unit cache
          # is refreshed
          mkdir -p scripts-cleanup scripts-refresh
          cp installer/macos/pump-cleanup.sh scripts-cleanup/postinstall
          (cd bin && ls -d *.vst3 *.component *.clap 2>/dev/null) > scripts-cleanup/pump-plugins.txt
          printf '#!/bin/sh\nkillall -9 AudioComponentRegistrar >/dev/null 2>&1\nexit 0\n' > scripts-refresh/postinstall
          chmod +x scripts-cleanup/postinstall scripts-refresh/postinstall
          pkgbuild --nopayload --scripts scripts-cleanup --identifier com.wake.pump.cleanup --version "$VERSION" pkgs-cleanup.pkg
          pkgbuild --nopayload --scripts scripts-refresh --identifier com.wake.pump.refresh --version "$VERSION" pkgs-refresh.pkg
          args="--package pkgs-cleanup.pkg"; for p in pkgs/*.pkg; do args="$args --package $p"; done; args="$args --package pkgs-refresh.pkg"
          productbuild $args --identifier com.wake.pump --version "$VERSION" dist/pump-macos.pkg
          ls -la dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: pump-macos
          path: |
            dist/pump-macos.*
            dist/system-eq-macos.zip

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5
      - name: Submodules (Eigen from its GitHub mirror, so a GitLab outage can't stop the build)
        shell: bash
        run: |
          git config --global url."https://github.com/eigen-mirror/eigen".insteadOf "https://gitlab.com/libeigen/eigen"
          for attempt in 1 2 3; do git submodule update --init --recursive --jobs 4 && break; echo "::warning::submodule attempt $attempt failed, retrying"; sleep 15; done
          git submodule status --recursive | tee submodules.txt
          if grep -q "^-" submodules.txt; then echo "::error::submodules could not be fetched"; exit 1; fi
      - name: Install dependencies
        timeout-minutes: 15
        run: |
          for attempt in 1 2 3; do
            sudo timeout 150 apt-get update -qq -o Acquire::Retries=3 && \
            sudo timeout 240 apt-get install -y -qq -o Acquire::Retries=3 libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libdbus-1-dev && break
            echo "apt attempt $attempt failed, retrying"; sleep 10
          done
      - name: Build
        run: |
          set -o pipefail
          make -j4 2>&1 | tee build.log \
            || { grep -E "error|Error|undefined|No rule" build.log | head -12 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - name: Package
        run: |
          mkdir -p dist/pump-linux && cp -r bin/*.vst3 bin/*.clap dist/pump-linux/ && cp THIRD_PARTY_NOTICES.md dist/pump-linux/
          cp plugins/machine/NOTICE.md dist/pump-linux/pump-MACHINE-NOTICE.md && cp plugins/machine/fw/LICENSE dist/pump-linux/pump-MACHINE-LICENSE-GPL-3.0.txt
          cd dist && tar czf pump-linux.tar.gz pump-linux
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with: { name: pump-linux, path: dist/pump-linux.tar.gz }

  room:
    # pump ROOM, the room measurement app: one self-contained page (wasm + fonts inside), opened in Chrome or Edge
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5
      - name: wasi-sdk 25
        run: |
          for attempt in 1 2 3; do
            curl -fsSL -o wasi.tgz https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-25/wasi-sdk-25.0-x86_64-linux.tar.gz && break
            echo "download attempt $attempt failed, retrying"; sleep 10
          done
          tar xzf wasi.tgz
      - name: Build
        run: WASI_SDK=$PWD/wasi-sdk-25.0-x86_64-linux sh room/build.sh dist/pump-room.html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with: { name: pump-room, path: dist/pump-room.html }

  room-app-mac:
    # pump ROOM as a desktop app (Electron), from the page the room job built; smoke-tested on its simulated room
    needs: room
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4
        with: { name: pump-room, path: bin }
      - name: Package
        run: |
          set -o pipefail
          sh room/electron/build.sh 2>&1 | tee package.log \
            || { echo "::error::$(grep -iE 'error|⨯|cannot|failed|not found' package.log | tail -12 | sed ':a;N;$!ba;s/\n/%0A/g')";
                 echo "::error::$(tail -30 package.log | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }
      - name: Smoke test (measures the simulated room in the packaged app)
        run: PUMP_ROOM_SMOKE=1 "$(ls -d room/electron/dist/mac-universal/*.app | head -1)/Contents/MacOS/pump ROOM"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with: { name: pump-room-macos, path: room/electron/dist/pump-room-macos.zip }

  room-app-windows:
    needs: room
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4
        with: { name: pump-room, path: bin }
      - name: Package
        run: |
          set -o pipefail
          sh room/electron/build.sh 2>&1 | tee package.log \
            || { echo "::error::$(grep -iE 'error|⨯|cannot|failed|not found' package.log | tail -12 | sed ':a;N;$!ba;s/\n/%0A/g')";
                 echo "::error::$(tail -30 package.log | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }
      - name: Smoke test (measures the simulated room in the packaged app)
        run: |
          code=0
          PUMP_ROOM_SMOKE=1 PUMP_ROOM_SMOKE_OUT="$PWD/smoke.txt" "room/electron/dist/win-unpacked/pump ROOM.exe" || code=$?
          cat smoke.txt || echo "no result written"
          exit $code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: pump-room-windows
          path: |
            room/electron/dist/pump-room-windows-setup.exe
            room/electron/dist/pump-room-windows.zip

  pages:
    # pump ROOM on the web: the room job's page published to the gh-pages branch on every push to main (GitHub Pages
    # serves it at https://matthettich.github.io/pump/ once Settings > Pages > Source is "Deploy from a branch",
    # branch gh-pages, folder / root). Plain git, no third-party actions.
    needs: room
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4
        with: { name: pump-room, path: site }
      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd site
          mv pump-room.html index.html
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "pump ROOM web app from $GITHUB_SHA"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

  release:
    needs: [tests, windows, macos, linux, room, room-app-mac, room-app-windows]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # one release at a time: two pushes close together would otherwise race to delete and recreate "latest"
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4
        with: { path: artifacts }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.pkg' -o -name '*.html' -o -name '*.exe' \))
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release create "$GITHUB_REF_NAME" $files --title "…pump $GITHUB_REF_NAME" --notes "Mastering plugins and creative effects by wake. See INSTALL.txt in each zip."
          else
            gh release delete latest --yes --cleanup-tag 2>/dev/null || true
            gh release create latest $files --prerelease --title "…pump (latest build)" \
              --notes "Newest build from main ($GITHUB_SHA). pump MACHINE is GPL-3.0 (pump-MACHINE-NOTICE.md in each package; source: this commit). Mac: pump-macos.pkg (installer; if macOS blocks it, System Settings > Privacy & Security > Open Anyway) or pump-macos.zip. The .pkg also installs System EQ (pump EQ on everything the Mac plays) in Applications; system-eq-macos.zip has the app on its own. Windows: pump-windows.zip. pump ROOM, the room measurement app: pump-room-macos.zip (Mac app), pump-room-windows-setup.exe or pump-room-windows.zip (Windows), or pump-room.html in Chrome / Edge on either system. Install steps are in INSTALL.txt inside each zip."
          fi
